<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h1>Finance Tracker</h1>
     <h3>Add Transaction</h3>
       <form id="form">
        <input type="text" placeholder="e.g Tesco Shopping" id="description" required>
        <input type="number" placeholder="e.g 25.50" id="amount" step="0.01" required>
        <select id="type">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
         </select>
         <button type="submit" id="submit-button">Add Transaction</button>
       </form>

       <h2>Financial Overview</h2>
       <div id="dashboard">
         <div id="balance">Balance: <span id="balance-value"> £0.00</span></div>
         <div id="income">Income: <span id="income-value"> £0.00</span></div>
         <div id="expenses">Expenses: <span id="expenses-value"> £0.00</span></div>
      </div>

         <h2>Transaction History</h2>
           <ul id="transaction-list">
             
           </ul>


    <script src="main.js"></script>
</body>
</html>
